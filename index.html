  ============================================================ -->

  <link rel="dns-prefetch" href="https://banglawebfonts.pages.dev" />

  <!-- ============================================================
  ✅ Service Worker Registration (Fixed)
  ============================================================ -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        const isProd = window.location.hostname !== 'localhost' && 
                       window.location.hostname !== '127.0.0.1' &&
                       !window.location.hostname.includes('netlify.app');
        
        if (isProd) {
          navigator.serviceWorker.register('/sw.js', {
            scope: '/',
          }).then(function(registration) {
            console.log('✅ Service Worker registered from index.html');
          }).catch(function(error) {
            console.warn('⚠️ Service Worker registration failed:', error);
          });
        }
      });
    }

    window.addEventListener('load', function() {
      if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('📱 App running in standalone mode (PWA)');
      }
    });
  </script>

  <!-- ============================================================
  ✅ Security Headers (CSP - UPDATED with Cloudflare Worker)
  ✅ Fixed: Added Cloudflare Worker URL to connect-src
  ============================================================ -->
  <meta
    http-equiv="Content-Security-Policy"
    content="
      default-src 'self';
      
      script-src 'self' 'unsafe-inline' 'unsafe-eval' 
        https://*.firebase.com 
        https://*.googleapis.com 
        https://*.cloudinary.com 
        https://apis.google.com 
        https://*.firebaseio.com
        https://www.google.com
        https://www.gstatic.com
        https://*.google.com
        https://*.googletagmanager.com
        https://*.google-analytics.com;
      
      style-src 'self' 'unsafe-inline' 
        https://fonts.googleapis.com 
        https://*.googleapis.com 
        https://cdnjs.cloudflare.com 
        https://banglawebfonts.pages.dev;
      
      font-src 'self' 
        https://*.googleapis.com 
        https://*.gstatic.com 
        https://cdnjs.cloudflare.com 
        https://banglawebfonts.pages.dev 
        data:;
      
      img-src 'self' data: https: http: blob: 
        https://*.cloudinary.com 
        https://*.googleapis.com 
        https://www.google.com 
        https://*.google.com 
        https://ui-avatars.com 
        https://via.placeholder.com 
        https://images.unsplash.com 
        https://*.githubusercontent.com
        https://*.gstatic.com;
      
      connect-src 'self' 
        https://*.firebase.com 
        https://*.googleapis.com 
        https://*.cloudinary.com 
        https://*.firebaseio.com 
        https://*.firebaseapp.com 
        wss://*.firebaseio.com 
        https://www.google.com
        https://*.google.com
        https://*.workers.dev
        https://worktrust-otp-production.hammanmusa362.workers.dev;
      
      frame-src 'self' 
        https://*.firebase.com 
        https://apis.google.com 
        https://*.firebaseapp.com
        https://www.google.com
        https://*.google.com;
      
      worker-src 'self' blob:;
      media-src 'self' blob: https://*.cloudinary.com;
    "
  />

</head>
